<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Hello World mit PyScript + Mermaid</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.2.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.2.1/core.js"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Dynamische UML-zu-Code-Generierung</h1>
        <div class="controls">
          <button id="resetSvg" class="btn btn-svg"><img src ="button/reset-svgrepo-com.svg" alt= "resetPosition" class = "button-icon"><span>Position</span></button>
          <button id="exportJson" class="btn btn-svg"><img src ="button/export-2-svgrepo-com.svg" alt= "exportJson" class = "button-icon"></button>
          <button id="importJson" class="btn btn-svg"><img src ="button/import-2-svgrepo-com.svg" alt= "importJson" class = "button-icon"></button>
          <button id="bearbeitenModus" class="btn btn-svg"><img src ="button/pencil-svgrepo-com.svg" alt= "bearbeiten" class = "button-icon"></button>
          <button id="ansichtmodus" class="btn btn-svg"><img src ="button/pencil-slash-svgrepo-com.svg" alt= "ansicht" class = "button-icon"></button>
          <button id="toggleCode" class="btn btn-svg"><img src ="button/code-svgrepo-com.svg" alt= "PythoenCode" class = "button-icon"></button>
        </div>
      </div>

      <div class="panels-container">
        <div class="uml-diagram" id="umlDiagram"></div>

        <div class="panel code-panel" id="codePanel">
          <div class="panel-header">Generierter Python Code</div>
          <div class="panel-content">
            <div class = "code-with-line-numbers">
              <div class="code-container" id="codeContainer"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="jsonModalOverlay" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="jsonModalTitle">
        <div class="modal-header">
          <div id="jsonModalTitle">JSON exportieren</div>
          <button class="btn btn-svg" id="jsonModalClose">×</button>
        </div>
        <div class="modal-body">
          <textarea id="jsonModalTextarea" spellcheck="false"></textarea>
        </div>
        <div class="modal-actions">
          <button id="jsonModalPrimary" class="btn">Kopieren</button>
          <button id="jsonModalTertiary" class="btn btn-label">Als JSON herunterladen</button>
          <button id="jsonModalSecondary" class="btn btn-svg">Schließen</button>
        </div>
      </div>
    </div>
    <input id="jsonFileInput" type="file" accept="application/json,.json" style="display: none;">

    <py-script src="main.py"></py-script>
    <script src="drag.js"></script>
  </body>
</html>
